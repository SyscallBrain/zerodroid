name: Release

# A version tag tests, builds, signs and publishes the release APK. A manual
# run builds the same APK (uploaded as the `dist` artifact) without
# publishing anything; without the signing secrets it is left unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Publication cannot proceed until the unit tests and the debug build pass
  # on this exact commit.
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Release builds never write to the Gradle cache shared with PRs.
          cache-read-only: true
      - name: Read the version
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag matches versionName
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match versionName $VERSION in app/build.gradle.kts" >&2
            exit 1
          fi
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERODROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "The ZERODROID_KEYSTORE_BASE64 secret is not set; a release must be signed" >&2
              exit 1
            fi
            echo "No signing secrets: building an unsigned APK" >&2
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ZERODROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the release APK
        env:
          ZERODROID_KEYSTORE_PASSWORD: ${{ secrets.ZERODROID_KEYSTORE_PASSWORD }}
          ZERODROID_KEY_ALIAS: ${{ secrets.ZERODROID_KEY_ALIAS }}
          ZERODROID_KEY_PASSWORD: ${{ secrets.ZERODROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify the signature and collect the files
        run: |
          mkdir dist
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -n "${ZERODROID_KEYSTORE:-}" ]; then
            apk=app/build/outputs/apk/release/app-release.apk
            "$apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "dist/zerodroid-$VERSION.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/zerodroid-$VERSION-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Needed only to publish the GitHub release for a version tag.
      contents: write
      # Signed build provenance for the APK (gh attestation verify).
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "ZeroDroid $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
