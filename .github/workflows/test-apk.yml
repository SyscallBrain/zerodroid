# Builds a ZeroDroid test APK, only when it is started by hand. Nothing is
# published: the APK is kept as a run artifact for 7 days. It is signed with
# the RELEASE key (the ZERODROID_* secrets), so it installs over the stable
# app without uninstalling or pairing again.
#
# Start it (from Termux, or anywhere with gh):
#   gh workflow run test-apk.yml -R SyscallBrain/zerodroid --ref <branch>
#   gh workflow run test-apk.yml -R SyscallBrain/zerodroid --ref <branch> -f checks=false
# Follow it and fetch the APK:
#   gh run watch -R SyscallBrain/zerodroid --exit-status
#   gh run download -R SyscallBrain/zerodroid --pattern 'zerodroid-*'
name: Test APK (manual)

# The only trigger is "Run workflow" / "gh workflow run": no push,
# pull_request or schedule, so it never starts on its own.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Run the unit tests before building
        type: boolean
        default: true

permissions: {}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        if: inputs.checks
        run: ./gradlew testDebugUnitTest

      # The keystore lives base64-encoded in a secret; it is written to the
      # runner's temp dir for the build only and deleted right after.
      - name: Set up the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERODROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The ZERODROID_KEYSTORE_BASE64 secret is not set; an unsigned APK cannot replace the stable app" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ZERODROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          ZERODROID_KEYSTORE_PASSWORD: ${{ secrets.ZERODROID_KEYSTORE_PASSWORD }}
          ZERODROID_KEY_ALIAS: ${{ secrets.ZERODROID_KEY_ALIAS }}
          ZERODROID_KEY_PASSWORD: ${{ secrets.ZERODROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the signature and label the APK
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk"
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          short=$(git rev-parse --short HEAD)
          echo "APK_NAME=zerodroid-$version-$short" >> "$GITHUB_ENV"
          mkdir out
          cp "$apk" "out/zerodroid-$version-$short.apk"
          {
            echo "repo:    $GITHUB_REPOSITORY"
            echo "branch:  $GITHUB_REF_NAME"
            echo "commit:  $(git rev-parse HEAD)"
            echo "run:     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "version: $version"
          } > out/BUILD-INFO.txt
          (cd out && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS BUILD-INFO.txt)

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: out/
          if-no-files-found: error
          retention-days: 7
