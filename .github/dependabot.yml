# Dependabot keeps the Gradle dependencies and the SHA-pinned GitHub Actions
# current. Security updates are enabled in the repository settings and open as
# soon as an advisory appears, independent of this schedule.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels: [dependencies, android]
    groups:
      # One PR for routine minor/patch bumps; major versions get their own PR
      # because they may need code changes.
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]
