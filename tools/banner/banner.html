<!DOCTYPE html>
<!--
  Artwork for the README banner and the GitHub social preview.
  Rendered by tools/banner/render.sh; open with ?social for the 1280x640 layout.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url(../../app/src/main/res/font/inter_variable.ttf); font-weight: 100 900; }
  @font-face { font-family: JBM; src: url(../../app/src/main/res/font/jetbrainsmono_medium.ttf); }

  :root {
    --bg: #07080B; --surface: #0F1116; --card: #151821;
    --text: #E7E9EE; --muted: #8A8F98; --cyan: #22D3EE; --blue: #3B82F6;
    --green: #34D399; --amber: #F5A524;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1600px; height: 720px; overflow: hidden; position: relative;
    font-family: Inter, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body.social { width: 1280px; height: 640px; }

  /* backdrop: soft glows, a faint grid and a few "signal" lines */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 720px; height: 720px; right: -120px; top: -260px; background: rgba(34, 211, 238, .16); }
  .g2 { width: 640px; height: 640px; right: 380px; bottom: -420px; background: rgba(59, 130, 246, .16); }
  .g3 { width: 520px; height: 520px; left: -260px; top: -200px; background: rgba(59, 130, 246, .08); }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 90% at 70% 50%, #000 30%, transparent 80%);
  }

  .copy { position: absolute; left: 96px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 720px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .icon {
    width: 96px; height: 96px; border-radius: 26px; background: var(--card);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 50px rgba(34, 211, 238, .18), inset 0 1px 0 rgba(255,255,255,.06);
    display: grid; place-items: center;
  }
  .icon svg { width: 78px; height: 78px; }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -4px; line-height: 1; }
  h1 span { background: linear-gradient(120deg, var(--cyan), var(--blue)); -webkit-background-clip: text; color: transparent; }
  .tagline { margin-top: 30px; font-size: 38px; font-weight: 500; letter-spacing: -.6px; line-height: 1.2; }
  .tagline em { font-style: normal; color: var(--cyan); }
  .sub { max-width: 590px; margin-top: 16px; font-size: 23px; color: var(--muted); line-height: 1.45; }
  .chips { margin-top: 34px; display: flex; flex-wrap: nowrap; gap: 10px; }
  .chip {
    font: 14px JBM, monospace; color: #cfd3da; padding: 8px 12px; white-space: nowrap; border-radius: 999px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    display: flex; align-items: center; gap: 9px;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .chip:nth-child(2) i { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .chip:nth-child(3) i { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .chip:nth-child(4) i { background: var(--blue); box-shadow: 0 0 10px var(--blue); }

  /* phones */
  .phones { position: absolute; right: 20px; top: 0; bottom: 0; width: 800px; }
  .phone {
    position: absolute; width: 300px; aspect-ratio: 720 / 1560;
    border-radius: 40px; padding: 9px; background: #1b1e26;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 80px rgba(0,0,0,.65), 0 0 0 1px #000 inset;
  }
  .phone img { width: 100%; height: 100%; border-radius: 32px; display: block; object-fit: cover; }
  .p1 { left: 20px;  top: 150px; transform: rotate(-7deg); }
  .p2 { left: 250px; top: 60px;  z-index: 2; width: 320px; }
  .p3 { left: 500px; top: 150px; transform: rotate(7deg); }
  .p1 img, .p3 img { filter: brightness(.85); }

  /* social preview: tighter copy, phones cropped by the bottom edge */
  .social .copy { left: 72px; width: 600px; }
  .social .chips { gap: 8px; }
  .social h1 { font-size: 88px; letter-spacing: -3.4px; }
  .social .icon { width: 82px; height: 82px; border-radius: 22px; }
  .social .icon svg { width: 66px; height: 66px; }
  .social .tagline { font-size: 33px; margin-top: 26px; }
  .social .sub { font-size: 20px; max-width: 520px; }
  .social .chip { font-size: 13px; padding: 7px 10px; gap: 7px; }
  .social .chips { gap: 7px; }
  .social .phones { right: -40px; width: 640px; }
  .social .phone { width: 270px; }
  .social .p1 { left: 10px;  top: 150px; }
  .social .p2 { left: 200px; top: 66px; width: 290px; }
  .social .p3 { left: 400px; top: 150px; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="grid"></div>

  <div class="copy">
    <div class="brand">
      <div class="icon">
        <!-- same bolt as the launcher icon (ic_launcher_foreground.xml) -->
        <svg viewBox="30 26 48 56"><defs><linearGradient id="b" x1="38" y1="30" x2="71" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs><path d="M58,30L38,57H52L49,78L71,49H56Z" fill="url(#b)"/></svg>
      </div>
      <h1>Zero<span>Droid</span></h1>
    </div>
    <p class="tagline">Your <em>ZeroClaw</em> agents,<br>in your pocket.</p>
    <p class="sub">A native Android client for the ZeroClaw daemon, on the same phone in Termux or on a machine at home.</p>
    <div class="chips">
      <span class="chip"><i></i>streaming chats</span>
      <span class="chip"><i></i>live tool calls</span>
      <span class="chip"><i></i>approvals</span>
      <span class="chip"><i></i>mTLS pairing</span>
    </div>
  </div>

  <div class="phones">
    <div class="phone p1"><img src="../../docs/screenshots/home.jpg"></div>
    <div class="phone p2"><img src="../../docs/screenshots/chat.jpg"></div>
    <div class="phone p3"><img src="../../docs/screenshots/tool-call.jpg"></div>
  </div>

  <script>if (location.search.includes('social')) document.body.classList.add('social');</script>
</body>
</html>
